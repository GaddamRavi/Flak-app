apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask-app

        image: ravi0619/flask-app:v3
        imagePullPolicy: IfNotPresent

        env:
        - name: APP_VERSION
          value: "1.1.0"
        - name: ENVIRONMENT
          value: "kubernetes"

        ports:
        - containerPort: 5000

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /readyz
            port: 5000
          initialDelaySeconds: 2
          periodSeconds: 5
